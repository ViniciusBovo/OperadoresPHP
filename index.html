<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo de Vida</title>
</head>
<body>
    <h1>Tempo de vida</h1>
    <hr>
    <!-- Crie um aplicação em PHP que receba, por meio de um formulário o nome e o ano de nascimento de uma pessoa. Com esses dados deverá calcular e exibir:
    - A idade
    - A quantidade aproximada de dias que ela já viveu
    - A quantidade aproximada de batimento cardiacos que seu coração já deu, considerando uma média de 75 batimentos por minuto;
    - quantos batimentos ainda restam
    considerando uma expectativa de vida média de 90 anos
    - A quantidade aproximada de dias, horas e minutos que ela já viveu
    -->

        <form action="calcular.php" method="post">
            <p>
                <label for="N">Nome</label>
                <input type="text" name="tnome" required>

            </p>
            <p>
                <label for="A">Ano de nascimento</label>
                <input type="number" name="tano" required min="1910" max="2026">
                <input type="submit" value="calcular"> <input type="reset" value="Limpar">
            </p>
        </form>
</body>
</html>
